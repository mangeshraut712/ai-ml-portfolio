name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System audio deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libsndfile1

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: MLFS tests + demo
        run: |
          python -m pytest tests -q
          PYTHONPATH=. python -m mlfs.demos.run_all

      - name: VAD unit tests
        run: python -m pytest labs/vad/test_vad_pipeline.py -q

      - name: LLM eval tests + smoke (stub only)
        env:
          EVAL_LIVE: "0"
        run: |
          python -m pytest labs/llm-eval/tests -q
          python labs/llm-eval/src/run_lab.py

  vad-full-pass:
    name: VAD FULL_PASS
    runs-on: ubuntu-latest
    needs: portfolio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System audio deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libsndfile1
      - name: Install + gate
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python labs/vad/challenge_pass.py
